<title>VAT Graph RAG ตรวจความสัมพันธ์</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;600;700&display=swap">
<style>
/* Layout: 3 ชั้น — ภาพรวม (ช่องทาง → หัวข้อ) › หัวข้อ (ข้อในแต่ละช่องทาง + สายการแก้ไข) › ข้อ (ตัวบทเต็ม)
   แผงขวา = ประเด็นที่ต้องตรวจของชั้นที่เปิดอยู่ (มือถือ: เรียงลงด้านล่าง) */
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#18212e; --muted:#5b6676; --line:#d8dde5; --soft:#eef1f6;
  --navy:#1f3a6b; --teal:#16786f; --amber:#a86a12; --grey:#8d96a3; --red:#b3261e; --green:#2e7d4f; --sel:#d99a00;
  --f-ui:"IBM Plex Sans Thai",system-ui,sans-serif; --f-law:"Sarabun","IBM Plex Sans Thai",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#192029; --ink:#e7eaef; --muted:#9ba5b3; --line:#2c3541; --soft:#212934;
  --navy:#86abef; --teal:#4fc1b6; --amber:#e2a54b; --grey:#68717e; --red:#f17c73; --green:#62c58c; --sel:#ffd24d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#192029; --ink:#e7eaef; --muted:#9ba5b3; --line:#2c3541; --soft:#212934;
  --navy:#86abef; --teal:#4fc1b6; --amber:#e2a54b; --grey:#68717e; --red:#f17c73; --green:#62c58c; --sel:#ffd24d; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
.wrap{max-width:1360px;margin:0 auto;padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-law);font-size:24px;font-weight:700;margin:0;text-wrap:balance}
.lead{margin:4px 0 0;color:var(--muted);max-width:75ch}
.lead b{color:var(--ink);font-weight:600}
nav.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px}
nav.crumb button{font:inherit;background:none;border:0;color:var(--navy);cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px}
nav.crumb span.cur{color:var(--ink);font-weight:600}
nav.crumb .sep{color:var(--muted)}
.levels{display:flex;gap:6px;font-size:12px;color:var(--muted)}
.levels i{font-style:normal;padding:2px 8px;border-radius:999px;background:var(--soft)}
.levels i.on{background:var(--navy);color:var(--panel)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.card>h2{font-size:13px;font-weight:600;margin:0;padding:12px 14px;border-bottom:1px solid var(--line);letter-spacing:.02em}
.pad{padding:14px}
button:focus-visible{outline:2px solid var(--sel);outline-offset:2px}

/* ชั้น 1: ช่องทาง → หัวข้อ */
.overview{position:relative;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px 90px;padding:18px}
.chs{align-self:center}
.overview svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.chs{display:flex;flex-direction:column;gap:14px}
.chn{border-radius:8px;padding:10px 12px;background:var(--navy);color:var(--panel);position:relative;z-index:1}
.chn.dbd{background:var(--amber)}
.chn b{display:block;font-family:var(--f-law);font-size:16px}
.chn small{display:block;opacity:.85;font-size:12px}
.tps{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-width:760px}
.tp{position:relative;z-index:1;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.tp:hover{border-color:var(--navy)}
.tp b{font-family:var(--f-law);font-size:15px;line-height:1.35}
.tp .d{font-size:12px;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink)}
.tag.p{background:var(--navy);color:var(--panel)} .tag.i{background:var(--teal);color:var(--panel)} .tag.d{background:var(--amber);color:var(--panel)}
.tag.err{background:var(--red);color:var(--panel)} .tag.warn{border:1px solid var(--amber);color:var(--amber);background:none}
.tag.ok{border:1px solid var(--green);color:var(--green);background:none} .tag.old{background:var(--grey);color:var(--panel)}

/* ชั้น 2: หัวข้อ */
.tdesc{font-size:14px;color:var(--muted);margin:0 0 4px}
.lane{border-top:1px solid var(--line);padding:14px 0 4px}
.lane:first-of-type{border-top:0}
.lane h3{font-size:13px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.chainrow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 2px 12px}
.node{flex:0 0 auto;width:210px;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1.5px solid var(--teal);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.node.old{border-style:dashed;border-color:var(--grey);color:var(--muted);background:var(--soft)}
.node.primary{width:280px;border-color:var(--navy);background:var(--navy);color:var(--panel)}
.node.special{width:280px;border-color:var(--amber);background:var(--amber);color:var(--panel)}
.node .yr{font-size:11px;font-weight:600;letter-spacing:.03em}
.node .sm{font-family:var(--f-law);font-size:14px;line-height:1.4}
.node .ch{font-size:11px;opacity:.85}
.node:hover{box-shadow:0 0 0 2px var(--sel)}
.arrow{flex:0 0 28px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:18px}
.chainnote{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.tests{margin-top:6px}
.test{border-top:1px solid var(--line);padding:10px 0}
.test .q{font-size:13px;color:var(--muted);margin:4px 0 0 12px}
details summary{cursor:pointer;font-size:13px;color:var(--navy)}

/* ชั้น 3: ข้อ */
.art h3{font-family:var(--f-law);font-size:20px;margin:0 0 6px;text-wrap:balance}
.meta{font-size:12px;color:var(--muted)}
.law{font-family:var(--f-law);font-size:15px;line-height:1.75;background:var(--bg);border-radius:8px;padding:12px 14px;margin:10px 0;max-width:80ch}
.hist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.hrow{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px;align-items:start;font-size:13px}
.hrow .y{font-weight:600}
.hrow button{font:inherit;text-align:left;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.sect{margin-top:14px}
.sect h4{font-size:12px;letter-spacing:.05em;color:var(--muted);margin:0 0 6px;font-weight:600}

/* ชั้น 4: โครงสร้างข้อ */
.tree{margin:6px 0 0}
.hn{border-left:2px solid var(--line);padding:6px 0 6px 12px;margin:0}
.hn.lv-article,.hn.lv-content{border-left:0;padding-left:0}
.hn .row{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.hn .k{font-weight:600;font-family:var(--f-law);font-size:15px;white-space:nowrap}
.hn .s{font-family:var(--f-law);font-size:14px;color:var(--ink)}
.hn.old>.row .s{color:var(--muted);text-decoration:line-through}
.hn .rel{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font:inherit;font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip.ref{border-color:var(--teal);color:var(--teal)} .chip.by{border-color:var(--navy);color:var(--navy)}
.chip.am{border-color:var(--amber);color:var(--amber)} .chip.ext{cursor:default;color:var(--muted)}
.hn details{margin-top:4px} .hn details summary{font-size:12px}
.hn .t{font-family:var(--f-law);font-size:14px;line-height:1.7;background:var(--bg);border-radius:6px;padding:8px 10px;margin-top:4px;white-space:pre-wrap}
.hk{margin-left:6px}
.flash{animation:flash 2.4s ease-out 1}
@keyframes flash{0%{background:color-mix(in srgb,var(--sel) 45%,transparent)}100%{background:transparent}}

/* ประเด็นที่ต้องตรวจ */
.chk{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-left:3px solid var(--amber);padding:6px 10px;margin:0 0 10px;cursor:pointer;border-radius:0 6px 6px 0}
.chk.error{border-left-color:var(--red)}
.chk:hover{background:var(--soft)}
.chk .lv{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--amber)}
.chk.error .lv{color:var(--red)}
.chk .t{display:block;font-size:13px;margin-top:2px}
.chk .dd{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.none{color:var(--muted);font-size:13px}
.hl{box-shadow:0 0 0 3px var(--sel)!important}
@media (max-width:1000px){.grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.overview{grid-template-columns:minmax(0,1fr);gap:14px}.overview svg{display:none}.chs{flex-direction:row;flex-wrap:wrap}.chn{flex:1 1 140px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

    <aside class="card"><h2 id="chk-h">ประเด็นที่ต้องตรวจ</h2><div class="pad" id="checks"></div></aside>
  </div>
</div>

<script>
(() => {
const D = JSON.parse(document.getElementById("data").textContent);
const A = D.arts, T = Object.fromEntries(D.topics.map(t => [t.id, t]));
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CH = {"57":{name:"กระดาษ",sub:"ฉบับ 57 · ยื่นที่สำนักงานสรรพากร",cls:"p"},"159":{name:"อินเทอร์เน็ต",sub:"ฉบับ 159 · www.rd.go.th",cls:"i"},"234":{name:"DBD",sub:"ฉบับ 234 · พร้อมจัดตั้งนิติบุคคล",cls:"d"}};
const artLabel = a => (a.art === "แนบท้าย" || a.art === "ท้ายประกาศ") ? a.art : "ข้อ " + a.art;
const nErr = D.checks.filter(c => c.level === "error").length;

$("lead").innerHTML = `ตัวบทหลักคือ <b>ฉบับ 57</b> (ยื่นกระดาษ) และ <b>ฉบับ 159</b> (ยื่นอินเทอร์เน็ต) ซึ่งรวมการแก้ไขของ 7 ฉบับไว้แล้ว ส่วน <b>ฉบับ 234</b> ใช้เฉพาะการยื่นพร้อมจัดตั้งนิติบุคคลผ่าน DBD
  · คลิกหัวข้อเพื่อดูข้อกฎหมายในแต่ละช่องทางและประวัติการแก้ไข แล้วคลิกข้อเพื่ออ่านตัวบท
  · พบประเด็นที่ต้องตรวจ <b>${D.checks.length} เรื่อง</b>${nErr ? ` (ข้อมูลขัดกัน ${nErr} เรื่อง)` : ""}`;

let state = {level:1, topic:null, art:null};
function go(s){ state = {...state, ...s}; render(); window.scrollTo({top:0, behavior:"smooth"}); }

function crumb(){
  const parts = [`<button data-l="1">ภาพรวม</button>`];
  if (state.level >= 2 && state.topic) parts.push(state.level === 2 ? `<span class="cur">${esc(T[state.topic].label)}</span>` : `<button data-l="2">${esc(T[state.topic].label)}</button>`);
  if (state.level === 3) { const a = A[state.art]; parts.push(`<span class="cur">ฉบับ ${a.ann} ${artLabel(a)}</span>`); }
  if (state.level === 1) parts[0] = `<span class="cur">ภาพรวม</span>`;
  $("crumb").innerHTML = parts.join('<span class="sep">›</span>');
  [...$("levels").children].forEach((el, i) => el.classList.toggle("on", i + 1 === state.level));
}
$("crumb").addEventListener("click", e => { const b = e.target.closest("[data-l]"); if (b) go({level:+b.dataset.l}); });

// ---------- ชั้น 1
function topicChecks(tid){ return D.checks.filter(c => c.topics.includes(tid)); }
function renderL1(){
  const tps = D.topics.map(t => {
    const cs = topicChecks(t.id), err = cs.some(c => c.level === "error");
    return `<button class="tp" data-topic="${t.id}"><b>${esc(t.label)}</b><span class="d">${esc(t.desc)}</span>
      <span class="tags">${Object.keys(t.lanes).map(k => `<span class="tag ${CH[k].cls}">${CH[k].name} ${t.lanes[k].map(x => artLabel(A[x])).join(", ")}</span>`).join("")}
      ${cs.length ? `<span class="tag ${err ? "err" : "warn"}">ต้องตรวจ ${cs.length}</span>` : `<span class="tag ok">ไม่พบประเด็น</span>`}</span></button>`;
  }).join("");
  $("main").innerHTML = `<h2>ชั้น 1 · ช่องทางยื่น → หัวข้อ</h2><div class="overview" id="ov"><svg id="ovsvg" aria-hidden="true"></svg>
    <div class="chs">${Object.entries(CH).map(([k, c]) => `<div class="chn ${k === "234" ? "dbd" : ""}" id="ch-${k}"><b>${c.name}</b><small>${c.sub}</small></div>`).join("")}</div>
    <div class="tps">${tps}</div></div>`;
  drawEdges();
}
function drawEdges(){
  const ov = $("ov"), svg = $("ovsvg"); if (!ov || getComputedStyle(svg).display === "none") return;
  const o = ov.getBoundingClientRect(), cs = getComputedStyle(document.documentElement);
  const col = {"57":cs.getPropertyValue("--navy"),"159":cs.getPropertyValue("--teal"),"234":cs.getPropertyValue("--amber")};
  let h = "";
  D.topics.forEach(t => { const el = ov.querySelector(`[data-topic="${t.id}"]`); if (!el) return; const r = el.getBoundingClientRect();
    Object.keys(t.lanes).forEach(k => { const c = $("ch-" + k).getBoundingClientRect();
      const x1 = c.right - o.left, y1 = c.top + c.height / 2 - o.top, x2 = r.left - o.left, y2 = r.top + r.height / 2 - o.top, mx = (x1 + x2) / 2;
      h += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="${col[k].trim()}" stroke-opacity=".35" stroke-width="1.5"/>`; }); });
  svg.innerHTML = h;
}
new ResizeObserver(() => state.level === 1 && drawEdges()).observe(document.body);

// ---------- ชั้น 2
function nodeHtml(id, isPrimary){
  const a = A[id], cls = isPrimary ? a.role : (a.current ? "amend" : "old");
  const yr = isPrimary ? `ตัวบทปัจจุบัน · ฉบับ ${a.ann} ${artLabel(a)}` : `ฉบับ ${a.ann} · ${a.year}${a.current ? "" : " · ถูกแทนที่แล้ว"}`;
  return `<button class="node ${cls}" data-art="${id}"><span class="yr">${esc(yr)}</span><span class="sm">${esc(a.summary)}</span>${!isPrimary && a.change ? `<span class="ch">${esc(a.change)}</span>` : ""}</button>`;
}
function testHtml(i){
  const t = D.tests[i], cls = t.ok / t.n < .5 ? "err" : t.ok / t.n < .8 ? "warn" : "ok";
  return `<div class="test"><span class="tag ${cls}">ค้นเจอ ${t.ok} จาก ${t.n}</span> คำถามเรื่อง "${esc(t.name)}"
    ${t.fails.length ? `<details><summary>คำถามที่ระบบค้นพลาด (${t.fails.length})</summary>${t.fails.map(f => `<p class="q">“${esc(f.q)}”<br>ระบบไปเจอ: ${esc(f.got.join(" / ") || "-")}</p>`).join("")}</details>` : ""}</div>`;
}
function renderL2(){
  const t = T[state.topic];
  let h = `<h2>ชั้น 2 · ${esc(t.label)}</h2><div class="pad"><p class="tdesc">${esc(t.desc)}</p>
    <p class="chainnote">แต่ละแถว: กรอบทึบซ้ายสุด = ข้อความที่ใช้อยู่วันนี้ในตัวบทหลัก ถัดไปทางขวา = ฉบับที่เคยแก้ข้อนั้น เรียงจากใหม่ไปเก่า (กรอบเส้นประ = ถูกฉบับหลังแทนที่แล้ว)</p>`;
  Object.entries(t.lanes).forEach(([k, ids]) => {
    h += `<section class="lane"><h3><span class="tag ${CH[k].cls}">${CH[k].name}</span>${esc(CH[k].sub)}</h3>`;
    ids.forEach(id => { const chain = A[id].chain.filter(x => !A[x].boiler);
      h += `<div class="chainrow">${nodeHtml(id, true)}${chain.slice().reverse().map(x => '<span class="arrow" aria-hidden="true">←</span>' + nodeHtml(x, false)).join("")}</div>`; });
    h += `</section>`;
  });
  if (t.tests.length) h += `<section class="tests"><h3 style="font-size:13px;margin:14px 0 4px">คำถามทดสอบที่ควรค้นเจอหัวข้อนี้</h3>${t.tests.map(testHtml).join("")}</section>`;
  $("main").innerHTML = h + "</div>";
}

// ---------- ชั้น 3
function renderL3(){
  const a = A[state.art];
  const roleTxt = {primary:"ตัวบทหลัก", amendment:"ฉบับแก้ไข", special:"ช่องทาง DBD"}[a.role];
  const parent = a.amends.map(p => A[p]);
  let h = `<h2>ชั้น 3 · ฉบับ ${a.ann} ${artLabel(a)}</h2><div class="pad art"><h3>${esc(a.summary)}</h3>
    <div class="tags"><span class="tag ${a.role === "primary" ? "p" : a.role === "special" ? "d" : "i"}">${roleTxt}</span>
    <span class="tag ${a.current ? "ok" : "old"}">${a.current ? "ยังมีผล" : "ถูกฉบับ " + esc(a.superseded_by.join(", ")) + " แทนที่แล้ว"}</span>
    ${a.year ? `<span class="tag">มีผล พ.ศ. ${a.year}</span>` : ""}${a.change ? `<span class="tag">${esc(a.change)}</span>` : ""}</div>
    <p class="meta">${esc(a.ref)}</p>`;
  if (a.hnode && D.H[a.hnode]) h += `<div class="sect"><h4>โครงสร้างข้อ (ข้อ → วรรค → อนุ → ย่อย) และการอ้างอิง</h4>
    <p class="meta">เส้นสีเขียว = ข้อความนี้อ้างถึง · สีน้ำเงิน = ถูกอ้างโดย · สีส้ม = การแก้ไข · คลิกเพื่อไปที่ข้อนั้น</p>
    <div class="tree">${treeHtml(a.hnode)}</div></div>`;
  else h += `<div class="law">${esc(a.text)}</div>`;
  if (parent.length) h += `<div class="sect"><h4>ข้อที่ฉบับนี้ไปแก้ในตัวบทหลัก</h4><div class="hist">${parent.map(p => `<div class="hrow"><span class="y">ฉบับ ${p.ann} ${artLabel(p)}</span><button data-art="${p.id}">${esc(p.summary)}</button></div>`).join("")}</div></div>`;
  const chain = a.chain.filter(x => !A[x].boiler);
  if (chain.length) h += `<div class="sect"><h4>ประวัติการแก้ไขข้อนี้ (เก่า → ใหม่)</h4><div class="hist">${chain.map(x => `<div class="hrow"><span class="y">${A[x].year} · ฉบับ ${A[x].ann}</span><button data-art="${x}">${esc(A[x].summary)}${A[x].current ? "" : " (ถูกแทนที่แล้ว)"}</button></div>`).join("")}</div></div>`;
  if (a.topics.length) h += `<div class="sect"><h4>อยู่ในหัวข้อ</h4><div class="tags">${[...new Set(a.topics)].map(t => `<button class="tag" style="border:0;cursor:pointer" data-topic="${t}">${esc(T[t]?.label || t)}</button>`).join("")}</div></div>`;
  if (a.syn.length) h += `<div class="sect"><h4>คำที่ผู้ใช้พิมพ์แล้วระบบจะดันข้อนี้ขึ้นมา</h4><p class="meta">${a.syn.map(esc).join(" · ")}</p></div>`;
  if (a.tests.length) h += `<div class="sect"><h4>คำถามทดสอบที่มีข้อนี้เป็นเฉลย</h4>${a.tests.map(testHtml).join("")}</div>`;
  $("main").innerHTML = h + "</div>";
}

// ---------- ชั้น 4: ต้นไม้โครงสร้างข้อ
const PARA_TH = {1:"วรรคหนึ่ง",2:"วรรคสอง",3:"วรรคสาม",4:"วรรคสี่",5:"วรรคห้า"};
const domId = id => "h-" + encodeURIComponent(id).replace(/%/g, "_");
const hName = id => { const n = D.H[id]; return n ? n.label : id; };
function hKey(n, id){
  if (n.level === "clause" || n.level === "item") return `(${n.key})`;
  if (n.level === "paragraph") { const m = id.match(/\/p(\d+)$/); return m ? (PARA_TH[m[1]] || "วรรค " + m[1]) : "วรรค"; }
  if (n.level === "note") return "หมายเหตุ";
  return n.label;
}
function chipFor(id, cls){
  const n = D.H[id]; if (!n) return "";
  if (n.level === "external") return `<span class="chip ext">${esc(n.label)}</span>`;
  return `<button class="chip ${cls}" data-h="${esc(id)}">${esc(n.label)}</button>`;
}
function treeHtml(id){
  const n = D.H[id]; if (!n) return "";
  const outs = n.out.map(([ph, t]) => [ph, t]);
  const groups = {}; outs.forEach(([ph, t]) => { (groups[ph] = groups[ph] || []).push(t); });
  const rel = [
    ...Object.entries(groups).map(([ph, ts]) => `<span class="meta">อ้างถึง “${esc(ph)}”:</span>${ts.map(t => chipFor(t, "ref")).join("")}`),
    n.in.length ? `<span class="meta">ถูกอ้างโดย:</span>${[...new Set(n.in)].map(t => chipFor(t, "by")).join("")}` : "",
    n.amends.length ? `<span class="meta">แก้ที่:</span>${n.amends.map(t => chipFor(t, "am")).join("")}` : "",
    n.amended_by.length ? `<span class="meta">แก้โดย:</span>${n.amended_by.map(t => chipFor(t, "am")).join("")}` : "",
  ].filter(Boolean).join(" ");
  const showText = n.text && (n.level !== "article" || n.kids.length === 0);
  const head = (n.level === "article" || n.level === "content")
    ? `<div class="row"><span class="k">${esc(n.label)}</span></div>${n.text ? `<div class="t">${esc(n.text)}</div>` : ""}`
    : `<div class="row"><span class="k">${esc(hKey(n, id))}</span><span class="s">${esc(n.short)}</span></div>
       ${showText ? `<details><summary>ข้อความเต็ม</summary><div class="t">${esc(n.text)}</div></details>` : ""}`;
  return `<div class="hn lv-${n.level}${n.current === false ? " old" : ""}" id="${domId(id)}">${head}
    ${rel ? `<div class="rel">${rel}</div>` : ""}
    ${n.kids.length ? `<div class="hk">${n.kids.map(treeHtml).join("")}</div>` : ""}</div>`;
}
function goH(id){
  const n = D.H[id]; if (!n || !n.chunk || !A[n.chunk]) return;
  if (!(state.level === 3 && A[state.art] && A[state.art].hnode === A[n.chunk].hnode)) go({level:3, art:n.chunk, topic: state.topic || A[n.chunk].topics[0] || null});
  setTimeout(() => { const el = document.getElementById(domId(id)); if (!el) return;
    el.querySelectorAll(":scope > details").forEach(d => d.open = true);
    el.scrollIntoView({block:"center", behavior:"smooth"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }, 120);
}

$("main").addEventListener("click", e => {
  const hb = e.target.closest("[data-h]");
  if (hb) { goH(hb.dataset.h); return; }
  const t = e.target.closest("[data-topic]"), a = e.target.closest("[data-art]");
  if (a) go({level:3, art:a.dataset.art, topic: state.topic || A[a.dataset.art].topics[0] || null});
  else if (t) go({level:2, topic:t.dataset.topic});
});

// ---------- ประเด็นที่ต้องตรวจ (ตามชั้นที่เปิดอยู่)
function renderChecks(){
  let cs = D.checks, head = "ประเด็นที่ต้องตรวจทั้งหมด";
  if (state.level === 2) { cs = topicChecks(state.topic); head = "ประเด็นในหัวข้อนี้"; }
  if (state.level === 3) { const a = A[state.art]; const rel = new Set([a.id, ...a.amends, ...a.chain]); cs = D.checks.filter(c => c.ids.some(i => rel.has(i))); head = "ประเด็นของข้อนี้"; }
  $("chk-h").textContent = head;
  $("checks").innerHTML = cs.length ? cs.map(c => `<button class="chk ${c.level}" data-ci="${D.checks.indexOf(c)}"><span class="lv">${c.level === "error" ? "ข้อมูลขัดกัน" : "ควรตรวจ"}</span><span class="t">${esc(c.title)}</span><span class="dd">${esc(c.detail)}</span></button>`).join("")
    : `<p class="none">ไม่พบประเด็นที่ต้องตรวจ${state.level > 1 ? " ในส่วนนี้" : ""}</p>`;
}
$("checks").addEventListener("click", e => { const b = e.target.closest("[data-ci]"); if (!b) return; const c = D.checks[+b.dataset.ci];
  const tid = c.topics[0] || null;
  if (c.ids.length === 1 || (c.test === undefined && state.level !== 1)) go({level:3, art:c.ids[0], topic:tid});
  else if (tid) go({level:2, topic:tid});
  setTimeout(() => c.ids.forEach(id => $("main").querySelectorAll(`[data-art="${id}"]`).forEach(el => el.classList.add("hl"))), 50);
});

function render(){ crumb(); ({1:renderL1, 2:renderL2, 3:renderL3})[state.level](); renderChecks(); }
render();
document.fonts && document.fonts.ready.then(() => state.level === 1 && drawEdges());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => state.level === 1 && drawEdges());
new MutationObserver(() => state.level === 1 && drawEdges()).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
})();
</script>
